# PR run that tests what the diff touches first, then explores the rest of the
# app with the steps left over. Every PR tests something, even one the impact
# map does not cover.
#
# To turn it on for one workflow without changing the config, use the action
# input instead:
#   free-exploration: 'true'
#
# Action inputs:
#   mode: pr
#   config: qa/agent-pr-free-exploration.yaml
#
# How 60 steps are split for a few diffs:
#   index.html                  2 journeys x 21 steps, then 18 explore the app
#   README.md                   no journey; all 60 explore the app
#   index.html + 3 other files  confidence 57%, below 60%, so the run widens:
#                               the journeys share 40% instead of 70%
#                               (2 x 12 steps) and 36 explore the app

target:
  baseUrl: http://127.0.0.1:8080

freeExploration: true

limits:
  maxSteps: 60

impactMap:
  - paths: [index.html]
    area: Login form
    journeys: [username / password / sign in]
    confidence: 0.9

  - paths: [index.html]
    area: Dynamic behaviour
    journeys: [load / enable / add list item]
    confidence: 0.9
